services:
  backend:
    build: ./backend
    container_name: aic-backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: ${MONGO_DB_NAME:-ai_interview_coach}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      # LLM keys are read from backend/.env (mounted into /app) or from these vars:
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # RAG (Qdrant + fastembed). QDRANT_URL points at the qdrant service.
      RAG_ENABLED: ${RAG_ENABLED:-true}
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_CACHE_DIR: data/models
      RAG_TOP_K: ${RAG_TOP_K:-5}
      KNOWLEDGE_BASE_DIR: /knowledge_base
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - backend_data:/app/data
      - ./data:/knowledge_base:ro
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: aic-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 })' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: aic-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10

volumes:
  mongo_data:
  backend_data:
  qdrant_data:
