services:
  backend:
    build: ./backend
    container_name: aic-backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: ${MONGO_DB_NAME:-ai_interview_coach}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      # Deliver queued ATS webhooks and resume-ingestion jobs in this single
      # backend process. Set to false only when a separate worker owns the queue.
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      # Keep OCR/preview work off the upload request in Compose. The UI polls
      # the resume status until the worker finishes. Set true for a single-
      # process/local setup without a running worker.
      RESUME_PROCESSING_INLINE: ${RESUME_PROCESSING_INLINE:-false}
      RESUME_OCR_LANGUAGES: ${RESUME_OCR_LANGUAGES:-eng}
      # LLM keys are read from backend/.env (mounted into /app) or from these vars:
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # RAG (Qdrant + fastembed). QDRANT_URL points at the qdrant service.
      RAG_ENABLED: ${RAG_ENABLED:-true}
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_CACHE_DIR: data/models
      RAG_TOP_K: ${RAG_TOP_K:-5}
      KNOWLEDGE_BASE_DIR: /knowledge_base
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - backend_data:/app/data
      - ./data:/knowledge_base:ro
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Inlined at build time: the browser calls the API on localhost:8000.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    container_name: aic-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: aic-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 })' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: aic-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Deliberately no Redis: rate limiting is per-process in-memory (one backend
  # instance) and background work uses the MongoDB-backed queue. Resume OCR and
  # preview rendering run in the worker; interactive LLM calls stay on the
  # request path with long timeouts. See README "Operational decisions".

volumes:
  mongo_data:
  backend_data:
  qdrant_data:
