line-length = 100
target-version = "py312"

# Legacy, unused Alembic files (the app uses MongoDB and creates indexes at startup).
extend-exclude = ["migrations"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = [
    # FastAPI's documented idiom puts Depends()/File() in parameter defaults.
    "B008",
    # `assert last_error is not None` style guards are intentional.
    "B011",
]

[lint.per-file-ignores]
"tests/**" = ["B"]
